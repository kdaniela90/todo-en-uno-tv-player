[build]
  command = "echo 'Static web player — no build required'"
  publish = "web"

[dev]
  publish = "web"
  port = 9000

[functions]
  directory = "netlify/functions"

# Proxy: redirige /xtream-api/* al servidor IPTV (evita CORS y mixed-content)
[[redirects]]
  from = "/xtream-api/*"
  to = "http://allinonestream.xyz:8080/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-live/*"
  to = "http://allinonestream.xyz:8080/live/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-chunks/*"
  to = "http://allinonestream.xyz:8080/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-vod/*"
  to = "http://allinonestream.xyz:8080/movie/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/xtream-series/*"
  to = "http://allinonestream.xyz:8080/series/:splat"
  status = 200
  force = true

# Media server HLS (canales en vivo): segmentos .ts y manifests con token
# IP: 23.237.104.74:8080
[[redirects]]
  from = "/xtream-media/*"
  to = "http://23.237.104.74:8080/:splat"
  status = 200
  force = true

# Media server VOD (películas): archivos MP4 con token
# IP: 23.158.40.201:80
[[redirects]]
  from = "/xtream-vod-media/*"
  to = "http://23.158.40.201:80/:splat"
  status = 200
  force = true
